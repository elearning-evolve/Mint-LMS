name: Mint LMS CI

# PHP syntax + WordPress coding standards now run in the shared WP QA workflow (wp-qa.yml).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Unit and architecture tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: composer arch
      - run: composer test:unit

  assets:
    name: JS and Tailwind build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Built files must be committed
        run: |
          if ! git diff --quiet -- assets/dist; then
            echo "::error::assets/dist is out of date. Run npm run build and commit assets/dist."
            git diff --stat -- assets/dist
            exit 1
          fi
